name: Scrape Rausgegangen Tübingen

on:
  # Zeitplan pausiert am 03.09.2026: rausgegangen.de liefert seit dem
  # 02.09.2026 nur noch 403 (Bunny-Shield-Botschutz mit JS-Challenge).
  # Vorher lieferte der Scraper seit 01.06.2026 stumm 0 Events, weil sich
  # das HTML der Seite geaendert hatte. Erst wieder einschalten, wenn es
  # eine offizielle Quelle (Feed/API) gibt.
  # schedule:
  #   - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --cached --quiet || git commit -m "Update feed $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
